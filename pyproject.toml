[project]
name = "slack-notify"
version = "0.1.0"
description = "Claude Code plugin that posts session recaps to Slack"
authors = [{ name = "Chad Allen" }]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".beads",
    "__pycache__",
    ".claude",
    ".claude-plugin",
    "ping_user_mcp.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
